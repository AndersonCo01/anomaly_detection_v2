name: Homework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Run tests - ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project
    strategy:
      matrix:
        include:
          - name: "Step 1: Preprocessing"
            test: tests/test_step1_preprocessing.py
            style: false
          - name: "Step 2: Dataset"
            test: tests/test_step2_dataset.py
            style: false
          - name: "Step 3: Model"
            test: tests/test_step3_model.py
            style: true
            style_test: tests/test_step3_style.py
          - name: "Step 4: Training"
            test: tests/test_step4_training.py
            style: true
            style_test: tests/test_step4_style.py
          - name: "Step 5: Inference"
            test: tests/test_step5_inference.py
            style: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: final_project/requirements.txt

      - name: Restore pip cache (fallback)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pip/wheels
          key: ${{ runner.os }}-pip-${{ hashFiles('final_project/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # try CPU wheels first; allow fallback if not available in cache
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu || true
          pip install -r requirements.txt

      - name: Run tests
        run: pytest ${{ matrix.test }} -v --tb=short

      - name: Style hints (advisory — won't affect your grade)
        if: ${{ matrix.style }}
        continue-on-error: true
        run: pytest ${{ matrix.style_test }} -v --tb=short
